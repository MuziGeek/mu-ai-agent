spring:
  application:
    name: mu-ai-agent
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
      # VL 视觉多模态模型配置
      vision:
        model: qwen-vl-max
      # Embedding 向量化模型配置（DashScope text-embedding-v3）
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024 # DashScope text-embedding-v3 默认输出 1024 维
        distance-type: COSINE_DISTANCE
        initialize-schema: true # 自动创建 vector_store 表，无需手动执行 DDL
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.muzi.muaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
